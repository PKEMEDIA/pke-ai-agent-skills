name: PKE Podcast Studio

on:
  push:
    branches:
      - main
    paths:
      - covicea-pke-podcast-studio/**
      - config/permanent-activation.json
      - .github/workflows/pke-podcast-studio.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pke-podcast-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Spec validate
        run: bash skill-creator/scripts/validate-skill.sh covicea-pke-podcast-studio
      - name: Local studio gate
        run: bash covicea-pke-podcast-studio/scripts/validate-local.sh
      - name: Required references
        run: |
          test -f covicea-pke-podcast-studio/references/orchestration-patterns.md
          test -f covicea-pke-podcast-studio/references/episode-bible.md
          test -f covicea-pke-podcast-studio/references/activation-playbook.md
      - name: DNA keywords
        run: |
          SKILL=covicea-pke-podcast-studio/SKILL.md
          grep -q "Aloha Shade Ohana" "$SKILL"
          grep -q "@Orchestrator" "$SKILL"
          grep -q "@FactChecker" "$SKILL"
          grep -q "@CoHost" "$SKILL"
          grep -q "@SocialATSEnhancer" "$SKILL"
          grep -q "Episode Bible" "$SKILL"
          grep -q "Spicy" "$SKILL"
      - name: Permanent enable registry
        run: |
          python3 -c "import json; from pathlib import Path; d=json.loads(Path('config/permanent-activation.json').read_text()); s=d['skills']['covicea-pke-podcast-studio']; assert d['enabled'] and s['permanent'] and s['spicy_default']; print('permanent enable OK', s['status'])"
      - name: Activation report
        run: echo "PKE Podcast Studio ONLINE permanent=true sha=${{ github.sha }}"
