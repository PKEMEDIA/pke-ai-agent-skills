# PKE AI Agent Skills — continuous validate + consensus/idempotency heal gate
# Optimized for speed: single job · shallow · path-filtered · parallel validate · lightweight consensus
# No actions/cache · checkout@v5 (Node 24) · wall-time one-liner
name: PKE Skill CI

on:
  push:
    branches: [main, master]
    paths:
      - '**/SKILL.md'
      - 'scripts/**'
      - 'config/**'
      - 'mind/**'
      - 'skill-creator/**'
      - 'skill-orchestrator/**'
      - 'covicea-pke-podcast-studio/**'
      - '.github/workflows/pke-skill-ci.yml'
      - 'README.md'
  pull_request:
    branches: [main, master]
    paths:
      - '**/SKILL.md'
      - 'scripts/**'
      - 'config/**'
      - 'mind/**'
      - 'skill-creator/**'
      - 'skill-orchestrator/**'
      - 'covicea-pke-podcast-studio/**'
      - '.github/workflows/pke-skill-ci.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: ad-hoc-validate

permissions:
  contents: read

concurrency:
  group: pke-skill-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills + brand pack
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (shallow)
        # v5 runs on Node 24 — silences Node 20 deprecation from actions/checkout@v4
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh 2>/dev/null || true
          chmod +x scripts/*.mjs 2>/dev/null || true
          chmod +x skill-creator/scripts/*.sh 2>/dev/null || true
          chmod +x skill-orchestrator/scripts/*.sh 2>/dev/null || true
          chmod +x skill-orchestrator/scripts/*.mjs 2>/dev/null || true
          chmod +x covicea-pke-podcast-studio/scripts/*.sh 2>/dev/null || true

      - name: Consensus heal gate (Raft-lite + stamp registry)
        # Shared Mac/CI entrypoint — same as terminal deploy + Super Mind
        run: bash scripts/consensus-gate.sh

      - name: CI validate skills (parallel)
        env:
          CI_VALIDATE_JOBS: "4"
        run: |
          set -euo pipefail
          t0=$(python3 -c 'import time; print(int(time.time()*1000))')
          bash scripts/ci-validate-skills.sh
          t1=$(python3 -c 'import time; print(int(time.time()*1000))')
          bash scripts/ci-record-validate-ms.sh $((t1 - t0))

      - name: Podcast studio local gate
        run: bash covicea-pke-podcast-studio/scripts/validate-local.sh

      - name: Brand pack + permanent activation stamps
        run: |
          set -e
          for p in \
            pke-face-lock/SKILL.md \
            pke-official-black-mask/SKILL.md \
            skill-orchestrator/SKILL.md \
            skill-creator/SKILL.md \
            covicea-pke-podcast-studio/SKILL.md \
            pke-synthetic-intellect/SKILL.md \
            README.md \
            mind/state.json \
            config/permanent-activation.json \
            scripts/ci-validate-skills.sh \
            scripts/consensus-gate.sh \
            scripts/ci-wall-summary.sh \
            skill-orchestrator/scripts/consensus-self-heal.mjs \
            skill-orchestrator/scripts/pke-self-heal.sh \
            skill-orchestrator/scripts/consensus-gate.sh \
            skill-orchestrator/references/heal-idempotency.md
          do
            test -f "$p" && echo "OK $p" || { echo "MISSING $p"; exit 1; }
          done
          grep -q 'covicea-pke-podcast-studio' config/permanent-activation.json
          echo "permanent activation stamp OK"

      - name: Wall-time summary
        if: always()
        run: bash scripts/ci-wall-summary.sh
